<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request GPU Compute Quote</title><style>body{background:#0b1220;color:#f0f5ff;font:16px system-ui;margin:0;padding:30px}main{max-width:580px;margin:auto}label{display:block;margin:16px 0 6px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #64748b;background:#111d30;color:white}button{background:#087f9b;border:0;margin-top:22px;font-weight:bold}small{color:#cbd5e1}.hidden{position:absolute;left:-10000px}</style></head><body><main><h1>GPU Compute — Request a Quote</h1><p>Tell us what you need. This is an enquiry, not a binding quote. Availability and pricing require supplier verification and manual approval. No payment is requested here.</p><form id="form"><label>Company<input name="company" maxlength="120" required></label><label>Contact name<input name="contactName" maxlength="120" required></label><label>Email<input name="email" type="email" maxlength="254" required></label><label>Workload<select name="workload"><option value="AI_INFERENCE">AI inference</option><option value="AI_TRAINING">AI training</option><option value="RENDERING">Rendering</option><option value="DATA_PROCESSING">Data processing</option><option value="OTHER">Other</option></select></label><label>GPU model<select name="gpuModel"><option>ANY</option><option>RTX 4090</option><option>RTX 5090</option><option>A100</option><option>H100</option><option>H200</option><option>L40S</option><option>B200</option></select></label><label>GPU count<input name="gpuCount" type="number" min="1" max="256" value="1" required></label><label>Estimated hours<input name="hours" type="number" min="1" max="8760" value="24" required></label><label>Requirements<textarea name="notes" maxlength="1000" rows="4"></textarea></label><div class="hidden"><label>Website<input name="website" autocomplete="off" tabindex="-1"></label></div><button type="submit">Submit enquiry</button></form><p id="message" role="status" aria-live="polite"></p><small>No automatic GPU provisioning, purchase or payment is initiated by this form.</small></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,m=document.querySelector('#message');m.textContent='Submitting…';try{const r=await fetch('/api/public/quote-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');m.textContent='Enquiry received. Reference: '+d.reference+'. We will review it manually.';f.reset()}catch(err){m.textContent='Could not submit: '+err.message}})</script></body></html>
